<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CivicConnect | Smart Complaint Portal</title><link rel="stylesheet" href="style.css"></head><body>
<section id="auth" class="auth"><div class="glass auth-card"><div class="brand">✦ Civic<span>Connect</span></div><p class="muted">Smart Complaint & Service Request Portal</p><h2 id="authTitle">Welcome back</h2><form id="authForm"><div id="nameField" class="field hidden"><label>Full name</label><input id="fullName" autocomplete="name"></div><div class="field"><label>Email address</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" minlength="6" required autocomplete="current-password"></div><button class="full" id="authSubmit">Sign in</button></form><p class="muted" id="authSwitch">New here? <button class="link" onclick="toggleAuth()">Create an account</button></p><p class="hint">Demo admin: admin@civicconnect.demo / Admin123!</p><p class="hint">Frontend demonstration only: do not use real passwords or personal information.</p></div></section>
<div id="app" class="layout hidden"><aside class="sidebar"><div class="brand">✦ Civic<span>Connect</span></div><nav class="nav" id="nav"></nav><div class="sidebar-bottom"><button class="secondary full" onclick="logout()">↪ Sign out</button></div></aside><main class="main"><div class="top"><h1 id="pageTitle">Dashboard</h1><div class="muted" id="greeting"></div></div><div id="content"></div></main></div><div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script src="script.js"></script></body></html>
